networks:
  web:
    external: true

services:
  server:
    image: php:8.5-apache
    networks:
    - web
    volumes:
    - ./src:/var/www/html:ro
    expose:
    - "80"
    labels:
    - "traefik.enable=true"
    - "traefik.docker.network=web"

    # --- Secure router
    - "traefik.http.routers.dielunte-secure.rule=Host(`dielunte.com`)"
    - "traefik.http.routers.dielunte-secure.entrypoints=websecure"

    # --- Insecure router
    - "traefik.http.routers.dielunte-insecure.rule=Host(`dielunte.com`)"
    - "traefik.http.routers.dielunte-insecure.entrypoints=web"
    - "traefik.http.routers.dielunte-insecure.middlewares=dielunte-https-redirect@docker"
    - "traefik.http.middlewares.dielunte-https-redirect.redirectscheme.scheme=https"
    - "traefik.http.middlewares.dielunte-https-redirect.redirectscheme.permanent=true"

    # --- WWW redirect router
    - "traefik.http.routers.dielunte-www.rule=Host(`www.dielunte.com`)"
    - "traefik.http.routers.dielunte-www.middlewares=dielunte-www-redirect@docker"
    - "traefik.http.middlewares.dielunte-www-redirect.redirectregex.regex=^https?://www.dielunte.com/(.*)"
    - "traefik.http.middlewares.dielunte-www-redirect.redirectregex.replacement=https://dielunte.com/$${1}"
    restart: unless-stopped
